[project]
name = "desksweep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arcpro00"}
]
requires-python = ">=3.8"
dependencies = [
    "typer>=0.20.0,<0.21.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0; python_version >= '3.10'",
    "pytest>=9.0.3; python_version >= '3.10'",
    "ruff>=0.15.16; python_version >= '3.10'",
]

[project.scripts]
desksweep = "desksweep.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
